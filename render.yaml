services:
  # --- Backend: FastAPI web service ---
  - type: web
    name: silentbridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./silentbridge.db
      - key: ALLOWED_ORIGINS
        value: https://silentbridge-frontend.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CALIBRATION_MIN_SECONDS
        value: "300"
      - key: MAX_INFERENCE_LATENCY_MS
        value: "500"
    # NOTE: no persistent Disk on the free tier — this SQLite file lives on
    # ephemeral local storage and resets on every redeploy/restart/spin-down.
    # Fine for a demo; if you need data to persist, upgrade this service to
    # a paid plan and add back a `disk:` block, or switch to an external DB
    # (e.g. Render's free Postgres) instead of SQLite.

  # --- Frontend: static site ---
  - type: web
    name: silentbridge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    envVars: []
